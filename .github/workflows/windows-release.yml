name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag this commit as v<version> and publish the release (default branch only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Validate release version
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:BUILD_REF.StartsWith('refs/tags/') -and $env:BUILD_TAG -ne "v$version") {
            throw "Tag must equal v$version."
          }
          if ($env:PUBLISH -eq 'true') {
            # A manual run may publish only the default branch, and never over an existing tag.
            if ($env:BUILD_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
              throw "Manual publishing is allowed only from $env:DEFAULT_BRANCH."
            }
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" *> $null
            if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists." }
            $global:LASTEXITCODE = 0
          }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned Inno Setup compiler
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_1/innosetup-7.0.1-beta-x64.exe' -OutFile $compiler
          $expected = 'a6033578da2c7b57ceaf9a97ebba56cb40bb71ed275170b49bbaf5eb1f4b5e16'
          if ((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup download SHA-256 mismatch.'
          }
          $process = Start-Process -FilePath $compiler -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Test, build, install, run, and uninstall
        run: ./packaging/build.ps1
      - name: Verify production installer paths and actual previous release upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from decap_manager import __version__; print(__version__)"
          ./scripts/verify_install_paths.ps1 -Installer "outputs/DecapAdjustment-$version-Setup-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: DecapAdjustment-Windows-x64
          path: |
            outputs/*-Setup-x64.exe
            outputs/*.sha256
            outputs/installer-verification.json
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $assets = @(Get-ChildItem outputs -File | Where-Object { $_.Name -match '(-Setup-x64\.exe|\.sha256|installer-verification\.json|\.verification\.json)$' } | ForEach-Object FullName)
          $arguments = @($env:RELEASE_TAG) + $assets + @('--title', "Decap Adjustment $env:RELEASE_TAG")
          # Hand-written notes for this version take precedence over the generated commit list.
          $notes = "packaging/release-notes/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) { $arguments += @('--notes-file', $notes) } else { $arguments += '--generate-notes' }
          if ($env:BUILD_REF.StartsWith('refs/tags/')) { $arguments += '--verify-tag' } else { $arguments += @('--target', $env:BUILD_SHA) }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
