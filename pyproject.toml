[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "decap-adjustment"
version = "1.3.0"
description = "Preview and audit SPD and Excel decap status adjustments and distance placement"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5"]
license = "MIT"

[project.gui-scripts]
decap-adjustment = "decap_manager.gui:main"

[tool.setuptools]
packages = ["decap_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
